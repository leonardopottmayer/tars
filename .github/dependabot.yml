# Security updates ignore target-branch: they always open against main and are handled like hotfixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # NuGet doesn't tell dev dependencies apart, so every update is a fix(deps).
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    # Major versions need their own review: MassTransit 9 is commercially licensed, StackExchange.Redis 3 has breaking changes.
    ignore:
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "StackExchange.Redis"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      nuget:
        patterns: ["*"]
