name: Pack

on:
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: 'Push packages to NuGet.org'
        required: false
        default: 'false'
        type: boolean

# Read-only token. Publishing to nuget.org uses NUGET_API_KEY, so the actions in this workflow are pinned
# to a commit hash: a moved tag cannot run new code next to that secret.
permissions:
  contents: read

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Pottmayer.Tars.slnx

      - name: Build
        run: dotnet build Pottmayer.Tars.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Pottmayer.Tars.slnx --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack Pottmayer.Tars.slnx --no-build --configuration Release --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7

      - name: Push to NuGet
        if: ${{ inputs.push_to_nuget == 'true' }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
