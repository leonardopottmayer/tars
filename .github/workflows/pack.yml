name: Pack

on:
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: 'Push packages to NuGet.org'
        required: false
        default: 'false'
        type: boolean

# Read-only token. Publishing to nuget.org uses NUGET_API_KEY, so the actions in this workflow are pinned
# to a commit hash: a moved tag cannot run new code next to that secret.
permissions:
  contents: read

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Pottmayer.Tars.slnx

      - name: Build
        run: dotnet build Pottmayer.Tars.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Pottmayer.Tars.slnx --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack Pottmayer.Tars.slnx --no-build --configuration Release --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7

      - name: Push to NuGet
        if: ${{ inputs.push_to_nuget == 'true' }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
