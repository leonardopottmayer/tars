name: Release preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # to comment on the pull request

jobs:
  preview:
    name: Release preview
    runs-on: ubuntu-latest

    steps:
      # The default checkout of a pull request is its merge into main: the same history semantic-release will see.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same rules as semantic-release with the conventionalcommits preset. A preview, not the source of truth.
      - name: Comment the next version
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          subjects=$(git log --no-merges --format='%s' "$range")
          bodies=$(git log --no-merges --format='%B' "$range")

          bump=none
          if grep -Eq '^(fix|perf)(\(.+\))?: ' <<< "$subjects"; then bump=patch; fi
          if grep -Eq '^feat(\(.+\))?: ' <<< "$subjects"; then bump=minor; fi
          if grep -Eq '^[a-z]+(\(.+\))?!: ' <<< "$subjects" || grep -Eq '^BREAKING[ -]CHANGE: ' <<< "$bodies"; then bump=major; fi

          if [ "$bump" = none ]; then
            next=""
          elif [ -z "$last" ]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case $bump in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          {
            echo "### Release preview"
            echo
            if [ -n "$next" ]; then
              echo "Merging this pull request releases **v$next** ($bump, previous: ${last:-none})."
            else
              echo "Merging this pull request releases nothing: no \`feat\`, \`fix\`, \`perf\` or breaking change since ${last:-the beginning}."
            fi
            echo
            echo "Commits:"
            echo
            sed 's/^/- /' <<< "$subjects"
          } > preview.md

          gh pr comment "$PR" --body-file preview.md --edit-last --create-if-none
